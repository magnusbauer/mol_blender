name: Windows local renderer boundaries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.7'
      - run: uv sync --locked --extra dev
      - run: .venv/Scripts/python.exe -m pytest tests/test_windows_platform.py tests/test_windows_setup.py tests/test_local.py tests/test_engine_package.py tests/test_developer_ccd_entry.py -q
      - run: uv build
