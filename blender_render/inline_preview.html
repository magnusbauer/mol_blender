<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Molecular render</title>
<style>
:root{color-scheme:light dark;font:14px system-ui,sans-serif}
html,body{margin:0;padding:0;background:transparent}img{display:block;width:100%;height:auto;object-fit:contain}nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0}nav[hidden]{display:none}a,button{font:inherit;color:inherit;border:1px solid #8886;border-radius:6px;padding:7px 12px;text-decoration:none}img[hidden]{display:none}p{margin:0;padding:12px;color:inherit}
</style>
<main id="render">
<img id="preview" alt="Blender molecular render" hidden>
<p id="status" role="status">Waiting for the rendered image…</p>
<nav id="downloads" aria-label="Download render" hidden></nav>
<button id="share" type="button" hidden>Ask ChatGPT about this image</button>
<p id="handoff" role="status" hidden></p>
<button id="save" type="button" hidden>Save files to Library</button>
<p id="saved" role="status" hidden></p>
<button id="library" type="button" disabled>Use saved image</button>
<p id="library-status" role="status" hidden></p>
</main>
<!-- viewer-options -->
<script>
const viewerOptions = JSON.parse(document.getElementById('viewer-options')?.textContent || '{}');
const image = document.getElementById('preview');
const status = document.getElementById('status');
let shown = false;
let saveSource = null;
let saveFiles = [];
let saving = false;
const pendingUploads = new Map();
let restoredFileId = null;
const saveButton = document.getElementById('save');
const savedStatus = document.getElementById('saved');
const libraryButton = document.getElementById('library');
const libraryStatus = document.getElementById('library-status');
const library = {mode: false, busy: false, selection: null, generation: 0};
const MAX_FILE_BYTES = 64 * 1024 * 1024;
function refreshLibrary() {
  libraryButton.disabled = library.busy || !window.openai?.selectFiles || !window.openai?.getFileDownloadUrl;
  if (library.mode && !library.busy) {
    libraryStatus.hidden = false;
    if (libraryButton.disabled) libraryStatus.textContent = 'Library selection is unavailable in this ChatGPT view.';
    else if (!handoff.image) libraryStatus.textContent = 'Choose a PNG or JPEG from your Library. The original render is not needed.';
  }
}
function hostFileCall(method, ...args) {
  // Only machine operations time out; the user can take as long as needed in the picker.
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('ChatGPT file operation timed out')), 30000);
    Promise.resolve().then(() => window.openai[method](...args))
      .then(resolve, reject).finally(() => clearTimeout(timer));
  });
}
function persistFiles(files, selected = library.selection) {
  const png = files['render.png'] || null;
  const ids = [selected?.fileId || png?.fileId].filter(Boolean);
  // The API is synchronous: this records state, not a durable-storage receipt.
  return window.openai?.setWidgetState?.({
    modelContent: selected ? 'An image was retrieved from ChatGPT file storage; saving to Space is not confirmed.' : 'Uploaded render files: ' + Object.keys(files).join(', '),
    privateContent: {savedImage:png, savedFiles:files, libraryImage:selected}, imageIds:ids
  });
}
function blobData(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Image could not be read'));
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.readAsDataURL(blob);
  });
}
async function libraryPixels(file) {
  const url = await savedFileUrl(file.fileId);
  const blob = await fetchFile(url, ['image/png', 'image/jpeg']);
  const bitmap = await createImageBitmap(blob); // Reject malformed image bytes before updating model state.
  let modelBlob = blob;
  const dimensions = {width:bitmap.width, height:bitmap.height};
  try {
    if (bitmap.width * bitmap.height > 64000000) throw new Error('Image dimensions are too large');
    if (blob.size > 2 * 1024 * 1024 || Math.max(bitmap.width, bitmap.height) > 2048) {
      const scale = Math.min(1, 1024 / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));

  if (!validInlineImage(preview, ['image/png', 'image/jpeg'])) throw new Error('Image preview is too large to send');

  if (globalThis.crypto?.subtle) {
    const digest = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());

}
async function useLibraryFile(file, generation) {
  const loaded = await libraryPixels(file);
  if (generation !== library.generation) return false;
  library.selection = {fileId:file.fileId, fileName:file.fileName || 'saved-image', mimeType:loaded.preview.mimeType};
  image.src = 'data:' + loaded.preview.mimeType + ';base64,' + loaded.preview.data;
  libraryStatus.dataset.sha256 = loaded.sha256 || '';
  libraryStatus.dataset.width = loaded.width;
  libraryStatus.dataset.height = loaded.height;
  setModelImage(loaded.preview, 'library-image');
  await persistFiles(savedFiles);
  libraryStatus.hidden = false;
  libraryStatus.textContent = 'Image retrieved from ChatGPT. Use “Ask ChatGPT about this image” to send it.';
  resize();

}
libraryButton.onclick = async () => {
  if (library.busy || !window.openai?.selectFiles || !window.openai?.getFileDownloadUrl) return;
  library.busy = true; refreshLibrary();
  libraryStatus.hidden = false;
  libraryStatus.textContent = 'Choose one saved PNG or JPEG image…';
  const generation = ++library.generation;
  try {
    const files = await window.openai.selectFiles();
    if (!files?.length) { libraryStatus.textContent = 'No image selected.'; return; }
    if (files.length !== 1 || typeof files[0]?.fileId !== 'string' || !files[0].fileId ||
        !['image/png','image/jpeg'].includes(files[0].mimeType)) throw new Error('Choose exactly one PNG or JPEG image');
    libraryStatus.textContent = 'Retrieving the image from ChatGPT Library…';
    await useLibraryFile(files[0], generation);
  } catch (error) {
    libraryStatus.textContent = 'Library image was not loaded. ' + (error instanceof TypeError ? 'The file request failed; check this viewer’s network permissions.' : error.message);
  } finally { library.busy = false; libraryButton.disabled = !window.openai?.selectFiles || !window.openai?.getFileDownloadUrl; resize(); }
};
// Standard MCP Apps image delivery is independent of optional file storage.
const host = {ready: false, capabilities: {}, pending: new Map(), sequence: 0};
const handoff = {image: null, contextKey: null, contextBusy: false,

const MAX_INLINE_IMAGE_BASE64_CHARS = 2796204;
const shareButton = document.getElementById('share');
const handoffStatus = document.getElementById('handoff');
function requestHost(method, params) {

    const timer = setTimeout(() => { host.pending.delete(id); reject(new Error('Host response timed out')); }, 10000);
    host.pending.set(id, {resolve, reject, timer});

  });
}
function imageContent(value) {

}
function validInlineImage(value, formats) {

    typeof value.data === 'string' && value.data.length > 0 && value.data.length <= MAX_INLINE_IMAGE_BASE64_CHARS &&

function updateHandoff() {

  shareButton.disabled = handoff.sharing || !!(handoff.image && handoff.postedImages.has(handoff.image.key));
  shareButton.textContent = handoff.image && handoff.postedImages.has(handoff.image.key) ? 'Image sent to ChatGPT' : 'Ask ChatGPT about this image';
  if (!host.ready || !handoff.image || handoff.contextBusy || handoff.contextKey === handoff.image.key ||
      !host.capabilities.updateModelContext?.image || viewerOptions.backgroundContext === false) return;

  handoff.contextKey = value.key; // Do not retry a failed/ambiguous request automatically.
  handoff.contextBusy = true;

    .then(result => {
      if (result?.isError) throw new Error('Context rejected');
      if (handoff.image?.key === value.key) {
        handoffStatus.hidden = false;
        handoffStatus.textContent = 'Image supplied as context for your next message.';
      }
    })
    .catch(() => {
      if (handoff.image?.key === value.key) {
        handoffStatus.hidden = false;
        handoffStatus.textContent = 'Image context could not be confirmed. You can send it using the button.';
      }

    .finally(() => { handoff.contextBusy = false; updateHandoff(); });
}
function normalizeEnvelope(envelope) {
  if (!envelope || typeof envelope !== 'object') return null;
  return envelope.mcp_tool_result || envelope.call_tool_result || envelope;
}
function resultImages(result) {
  const supplied = result._meta?.preview || result.preview;
  const content = Array.isArray(result.content) ? result.content : [];
  const modelImage = value => validInlineImage(value, ['image/png', 'image/jpeg']);
  return {
    preview: supplied || content.find(item => item.type === 'image' && ['image/png','image/gif'].includes(item.mimeType)),
    model: modelImage(supplied) ? supplied : content.find(modelImage)
  };
}
function setModelImage(value, job) {
  if (!value) return;
  const key = job + '/' + value.mimeType + '/' + value.data;
  if (handoff.image?.key === key) return;
  handoff.image = {mimeType:value.mimeType, data:value.data, key, job};
  handoffStatus.hidden = true;
  updateHandoff();
}
shareButton.onclick = async () => {
  if (handoff.sharing || !host.ready || !handoff.image || !host.capabilities.message?.image || viewerOptions.imageMessage === false || handoff.postedImages.has(handoff.image.key)) return;
  const value = handoff.image;
  handoff.sharing = true;
  updateHandoff();
  handoffStatus.hidden = false;
  handoffStatus.textContent = 'Sending image to ChatGPT…';
  try {
    const content = imageContent(value);
    content[0].text += viewerOptions.messagePrompt || ' Describe what you can see in this image.';
    const result = await requestHost('ui/message', {role:'user', content});
    if (result?.isError) throw new Error('Image rejected');
    handoff.postedImages.add(value.key);
    if (handoff.image?.key === value.key) handoffStatus.textContent = 'Image sent to ChatGPT for this conversation.';
  } catch (_) {
    if (handoff.image?.key === value.key) handoffStatus.textContent = 'Image delivery is unconfirmed. Check the chat before retrying.';
  } finally { handoff.sharing = false; updateHandoff(); }
};
let storedImage = window.openai?.widgetState?.privateContent?.savedImage || null;
let savedFiles = window.openai?.widgetState?.privateContent?.savedFiles || {};
if (storedImage && !savedFiles['render.png']) savedFiles['render.png'] = storedImage;
const fileTypes = {'render.png':'image/png','render.gif':'image/gif','render.mp4':'video/mp4',
  'render.blend':'application/octet-stream','manifest.json':'application/json','frames.zip':'application/zip'};
function alreadySaved(file) { return !!savedFiles[file.name]?.fileId && savedFiles[file.name].jobId === file.jobId; }
function hydrateState(state) {
  const files = state?.privateContent?.savedFiles || {};
  for (const [name, file] of Object.entries(files)) {
    if (fileTypes[name] && typeof file?.fileId === 'string' && file.fileId &&
        (!saveSource || file.jobId === saveSource.jobId)) savedFiles[name] = file;
  }
  storedImage = savedFiles['render.png'] || storedImage;
  if (!library.selection && state?.privateContent?.libraryImage) library.selection = state.privateContent.libraryImage;
}
function httpsUrl(value) {
  try {
    const url = new URL(value);
    if (url.protocol === 'https:' && !url.username && !url.password) return url;

}

  const url = httpsUrl(value);

  if (purpose === 'preview' && preview) return url;
  if (purpose === 'download' && download) return url;

  return null;
}
async function savedFileUrl(fileId) {
  const {downloadUrl} = await hostFileCall('getFileDownloadUrl', {fileId});
  const url = httpsUrl(downloadUrl);
  if (!url) throw new Error('Invalid saved-file URL');
  return url.href;
}
async function fetchFile(url, formats) {

  if (!formats.includes(mimeType)) throw new Error('Unsupported file type');
  if (Number(response.headers.get('content-length')) > MAX_FILE_BYTES) throw new Error('File exceeds 64 MiB');

  if (!blob.size || blob.size > MAX_FILE_BYTES) throw new Error('File is empty or exceeds 64 MiB');

function downloadControls(links = []) {
  const bar = document.getElementById('downloads');

  for (const item of links) {
    const url = rendererUrl(item.url, 'download');
    if (fileTypes[item.name] && url) entries.set(item.name, {...item, url: url.href});
  }
  for (const [name, file] of Object.entries(savedFiles)) {
    if (!saveSource || file.jobId === saveSource.jobId) entries.set(name, {...entries.get(name), name, jobId:file.jobId});
  }
  for (const item of entries.values()) {
    if (!fileTypes[item.name]) continue;
    const href = item.url || null;
    const saved = savedFiles[item.name];
    if (!href && !saved?.fileId) continue;
    const link = document.createElement('a');
    link.textContent = 'Download ' + item.name.split('.').pop().toUpperCase();
    link.href = href || '#'; link.target = '_blank'; link.rel = 'noopener noreferrer';
    link.addEventListener('click', async event => {
      const file = savedFiles[item.name];
      if (file?.fileId && (!item.jobId || file.jobId === item.jobId)) {
        event.preventDefault();
        try {
          const href = await savedFileUrl(file.fileId);
          if (window.openai?.openExternal) window.openai.openExternal({href});
          else window.open(href, '_blank', 'noopener,noreferrer');
        } catch (_) { savedStatus.hidden=false; savedStatus.textContent='The saved file could not be opened.'; }
      } else if (href && window.openai?.openExternal) {
        event.preventDefault(); window.openai.openExternal({href});
      }

}
let downloadLinks = [];
async function restoreSavedImage() {
  const saved = library.selection || savedFiles['render.gif'] || storedImage;
  if (!saved?.fileId || !window.openai?.getFileDownloadUrl || restoredFileId === saved.fileId) return;
  restoredFileId = saved.fileId;
  const generation = library.generation;
  try {
    if (!library.selection && savedFiles['render.gif']?.fileId === saved.fileId) {
      const url = await savedFileUrl(saved.fileId);
      if (generation !== library.generation) return;
      image.src = url;
    } else {
      if (!await useLibraryFile(saved, generation)) return;
    }
    savedStatus.hidden = false;
    savedStatus.textContent = 'Uploaded image reopened from ChatGPT. This does not confirm it appears in Space.';
  } catch (_) {
    savedStatus.hidden = false;
    savedStatus.textContent = 'The saved image could not be reopened. Use “Use saved image” to select it again.';
  }
}
function refreshSaving() {
  refreshLibrary();
  hydrateState(window.openai?.widgetState);
  downloadControls(downloadLinks);
  if (!image.getAttribute('src') && (library.selection || savedFiles['render.gif'] || storedImage)) restoreSavedImage();
  if (!saveSource) return;
  const available = !!(window.openai?.uploadFile && window.openai?.setWidgetState);
  saveButton.hidden = !available;
  if (!available) {
    savedStatus.hidden = false;
    savedStatus.textContent = 'File saving is unavailable in this host. The image is still visible in this panel.';
    resize();
  }
}
saveButton.onclick = async () => {
  if (saving || !saveSource || !window.openai?.uploadFile || !window.openai?.setWidgetState) return;
  const sources = saveFiles.map(file => ({...file}));
  saving = true; saveButton.disabled = true; savedStatus.hidden = false;
  const failed = [];

    if (alreadySaved(source)) continue;
    const key = source.jobId + '/' + source.name;
    savedStatus.textContent = 'Saving ' + source.name.split('.').pop().toUpperCase() + ' to ChatGPT…';

      let fileId = pendingUploads.get(key);
      if (!fileId) {
        let blob;

          const url = rendererUrl(source.url, 'save');

          blob = await fetchFile(url.href, [fileTypes[source.name]]);
        }
        if (blob.size > MAX_FILE_BYTES) throw new Error();
        const fileName = typeof source.fileName === 'string' && /^[A-Za-z0-9_.-]{1,100}$/.test(source.fileName) ? source.fileName : source.name;

        if (typeof fileId !== 'string' || !fileId) throw new Error();
        pendingUploads.set(key, fileId);

      if (saveSource.jobId !== source.jobId) break;
      const nextFiles = {...savedFiles, [source.name]:{fileId, jobId:source.jobId}};
      const nextImage = nextFiles['render.png'] || null;

    (failed.length ? failed.join(', ') + ' not saved. Retry or download these files.' : '');

  saveButton.textContent = failed.length ? 'Retry saving files' : 'Files uploaded';

function resize() {
  const height = Math.ceil(document.getElementById('render').getBoundingClientRect().height);

}

    savedFiles = Object.fromEntries(Object.entries(savedFiles).filter(([,file]) => file.jobId === source.jobId));

    saveSource = source;

image.onload = () => {
  shown = true;
  image.hidden = false;
  status.hidden = true;
  resize();
};
image.onerror = () => {
  shown = false;
  image.hidden = true;
  status.hidden = false;
  status.textContent = 'The preview is unavailable or has expired. Rendering has not been repeated.';

};
window.addEventListener('message', event => {

  if (window.openai?.uploadFile && window.openai?.setWidgetState && window.openai?.selectFiles) clearInterval(bridgeTimer);
  else if (++bridgeChecks >= 30) clearInterval(bridgeTimer);

hydrateState(window.openai?.widgetState);
refreshLibrary();
downloadControls();

if ((library.selection || storedImage || savedFiles['render.gif']) && !image.getAttribute('src')) restoreSavedImage();
if (parent !== window) parent.postMessage({jsonrpc:'2.0',id:'initialize',method:'ui/initialize',params:{
  appInfo:{name:'Blender Render',version:'0.2.0b1'},appCapabilities:{},protocolVersion:'2026-01-26'
}}, '*');
setTimeout(() => {
  if (!library.mode && !shown && !image.getAttribute('src')) {
    status.textContent = 'ChatGPT has not supplied the image to this viewer. Rendering has not been repeated.';
    resize();
  }
}, 15000);
</script>
