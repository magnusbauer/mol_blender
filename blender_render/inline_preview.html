<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Molecular render</title>
<style>
:root{color-scheme:light dark;font:14px system-ui,sans-serif}
html,body{margin:0;padding:0;background:transparent}img{display:block;width:100%;height:auto;object-fit:contain}nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0}nav[hidden]{display:none}a,button{font:inherit;color:inherit;border:1px solid #8886;border-radius:6px;padding:7px 12px;text-decoration:none}img[hidden]{display:none}p{margin:0;padding:12px;color:inherit}
</style>
<main id="render">
<img id="preview" alt="Blender molecular render" hidden>
<p id="status" role="status">Waiting for the rendered image…</p>
<nav id="downloads" aria-label="Download render" hidden></nav>
<button id="save" type="button" hidden>Save image to chat</button>
<p id="saved" role="status" hidden></p>
</main>
<script>
const image = document.getElementById('preview');
const status = document.getElementById('status');
let shown = false;
let saveSource = null;
let saveFiles = [];
let saving = false;
const autoSaveAttempts = new Set();
const saveButton = document.getElementById('save');
const savedStatus = document.getElementById('saved');
let storedImage = window.openai?.widgetState?.privateContent?.savedImage || null;
let savedFiles = window.openai?.widgetState?.privateContent?.savedFiles || {};
if (storedImage && !savedFiles['render.png']) savedFiles['render.png'] = storedImage;
const fileTypes = {'render.png':'image/png','render.gif':'image/gif','render.mp4':'video/mp4'};
function alreadySaved(file) { return savedFiles[file.name]?.jobId === file.jobId; }
async function restoreSavedImage() {
  const saved = savedFiles['render.gif'] || storedImage;
  if (!saved?.fileId || !window.openai?.getFileDownloadUrl) return;
  try {
    const {downloadUrl} = await window.openai.getFileDownloadUrl({fileId:saved.fileId});
    const url = new URL(downloadUrl);
    if (url.protocol !== 'https:') return;
    image.src = url.href;
    savedStatus.hidden = false;
    savedStatus.textContent = 'Image saved in ChatGPT.';
  } catch (_) {
    savedStatus.hidden = false;
    savedStatus.textContent = 'The saved image could not be opened in this session.';
  }
}
function autoSave() {
  if (!saveSource || saving || saveFiles.every(alreadySaved) ||
      autoSaveAttempts.has(saveSource.jobId) || !window.openai?.uploadFile || !window.openai?.setWidgetState) return;
  autoSaveAttempts.add(saveSource.jobId);
  saveButton.onclick();
}
saveButton.onclick = async () => {
  if (saving || !saveSource || !window.openai?.uploadFile || !window.openai?.setWidgetState) return;
  const sources = saveFiles.map(file => ({...file}));
  saving = true; saveButton.disabled = true; savedStatus.hidden = false;
  const failed = [];
  for (const source of sources) {
    if (alreadySaved(source)) continue;
    savedStatus.textContent = 'Saving ' + source.name.split('.').pop().toUpperCase() + ' to ChatGPT…';
    try {
      const url = new URL(source.url);
      if (!fileTypes[source.name] || url.protocol !== 'https:' || url.username || url.password || !url.pathname.startsWith('/preview/')) throw new Error();
      const response = await fetch(url.href, {credentials:'omit', signal:AbortSignal.timeout(30000)});
      if (!response.ok || !response.headers.get('content-type')?.startsWith(fileTypes[source.name])) throw new Error();
      const blob = await response.blob();
      if (blob.size > 64 * 1024 * 1024) throw new Error();
      const {fileId} = await window.openai.uploadFile(new File([blob], source.name, {type:fileTypes[source.name]}));
      if (typeof fileId !== 'string' || !fileId) throw new Error();
      const nextFiles = {...savedFiles, [source.name]:{fileId, jobId:source.jobId}};
      const nextImage = nextFiles['render.png'] || null;
      window.openai.setWidgetState({modelContent:'Saved render files: ' + Object.keys(nextFiles).join(', '),
        privateContent:{savedImage:nextImage, savedFiles:nextFiles}, imageIds:nextImage ? [nextImage.fileId] : []});
      savedFiles = nextFiles; storedImage = nextImage;
    } catch (_) { failed.push(source.name); }
  }
  const confirmed = sources.filter(alreadySaved).map(f => f.name.split('.').pop().toUpperCase());
  savedStatus.textContent = (confirmed.length ? confirmed.join(', ') + ' saved in ChatGPT. ' : '') +
    (failed.length ? failed.join(', ') + ' not saved. Retry or download these files.' : '');
  saveButton.disabled = !failed.length;
  saveButton.textContent = failed.length ? 'Retry saving files' : 'Files saved';
  saving = false; resize();
};
function resize() {
  const height = Math.ceil(document.getElementById('render').getBoundingClientRect().height);
  window.openai?.notifyIntrinsicHeight?.(height);
  if (parent !== window) parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height}}, '*');
}
function render(envelope) {
  if (!envelope || typeof envelope !== 'object') return;
  // ChatGPT wraps the MCP envelope; MCP Apps sends it directly. Older
  // ChatGPT bridges expose the hidden metadata as the value itself.
  const result = envelope.mcp_tool_result || envelope.call_tool_result || envelope;
  const legacy = result._meta?.saveImage || result.saveImage;
  const files = result._meta?.saveFiles || result.saveFiles || (legacy ? [{...legacy,name:'render.png',mimeType:'image/png'}] : []);
  const source = files[0];
  if (files.length) saveFiles = files.filter(file => fileTypes[file.name]);
  if (source) {
    saveSource = source;
    saveButton.hidden = !(window.openai?.uploadFile && window.openai?.setWidgetState);
    if (saveFiles.every(alreadySaved)) { saveButton.disabled = true; saveButton.textContent = 'Files saved'; }
    autoSave();
  }
  const links = result._meta?.downloads || result.downloads;
  if (Array.isArray(links)) {
    const bar = document.getElementById('downloads');
    bar.replaceChildren();
    for (const item of links) {
      if (!['render.gif','render.mp4','render.png'].includes(item.name)) continue;
      try {
        const url = new URL(item.url);
        if (url.protocol !== 'https:' || url.username || url.password || !url.pathname.startsWith('/download/')) continue;
        const link = document.createElement('a');
        link.textContent = 'Download ' + item.name.split('.').pop().toUpperCase();
        link.href = url.href; link.target = '_blank'; link.rel = 'noopener noreferrer';
        link.addEventListener('click', async event => {
          const saved = savedFiles[item.name];
          if (saved?.fileId && window.openai?.getFileDownloadUrl) {
            event.preventDefault();
            try {
              const {downloadUrl} = await window.openai.getFileDownloadUrl({fileId:saved.fileId});
              if (window.openai?.openExternal) window.openai.openExternal({href:downloadUrl});
              else window.open(downloadUrl, '_blank', 'noopener,noreferrer');
            } catch (_) { savedStatus.hidden=false; savedStatus.textContent='The saved file could not be opened.'; }
            return;
          }
          if (window.openai?.openExternal) {
            event.preventDefault(); window.openai.openExternal({href:link.href});
          }
        });
        bar.append(link);
      } catch (_) {}
    }
    bar.hidden = !bar.children.length;
    resize();
  }
  const preview = result._meta?.preview || result.preview ||
    result.content?.find(item => item.type === 'image' && ['image/png','image/gif'].includes(item.mimeType));
  if (preview?.mimeType === 'image/gif' && typeof preview.url === 'string' && preview.url.length < 4096) {
    try {
      const url = new URL(preview.url);
      if (url.protocol === 'https:' && !url.username && !url.password && url.pathname.startsWith('/preview/')) {
        if (image.getAttribute('src') !== url.href) image.src = url.href;
        return;
      }
    } catch (_) {}
  }
  if (['image/png','image/gif'].includes(preview?.mimeType) && typeof preview.data === 'string' &&
      preview.data.length <= 2796204 && /^[A-Za-z0-9+/]+={0,2}$/.test(preview.data)) {
    const source = 'data:' + preview.mimeType + ';base64,' + preview.data;
    if (image.getAttribute('src') !== source) image.src = source;
    return;
  }
  if (!shown && result.structuredContent) {
    status.textContent = 'The image preview is unavailable. Rendering has not been repeated.';
  }
}
new ResizeObserver(resize).observe(document.getElementById('render'));
image.onload = () => {
  shown = true;
  image.hidden = false;
  status.hidden = true;
  resize();
};
image.onerror = () => {
  shown = false;
  image.hidden = true;
  status.hidden = false;
  status.textContent = 'The preview is unavailable or has expired. Rendering has not been repeated.';
  if ((storedImage || savedFiles['render.gif']) && !image.dataset.restoring) { image.dataset.restoring = 'true'; restoreSavedImage(); }
  resize();
};
window.addEventListener('message', event => {
  if (event.source !== parent || event.data?.jsonrpc !== '2.0') return;
  const message = event.data;
  if (message.method === 'ping' && message.id !== undefined) {
    parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}}, '*');
  }
  if (message.method === 'ui/notifications/tool-result') render(message.params);
  if (message.id === 'initialize' && message.result) {
    parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'}, '*');
  }
});
window.addEventListener('openai:set_globals', event => {
  render(event.detail?.globals?.toolResponseMetadata);
  autoSave();
});
render(window.openai?.toolResponseMetadata);
render(window.openai?.toolOutput);
if ((storedImage || savedFiles['render.gif']) && !image.getAttribute('src')) restoreSavedImage();
if (parent !== window) parent.postMessage({jsonrpc:'2.0',id:'initialize',method:'ui/initialize',params:{
  appInfo:{name:'Blender Render',version:'0.2.0b1'},appCapabilities:{},protocolVersion:'2026-01-26'
}}, '*');
setTimeout(() => {
  if (!shown && !image.getAttribute('src')) {
    status.textContent = 'ChatGPT has not supplied the image to this viewer. Rendering has not been repeated.';
    resize();
  }
}, 15000);
</script>
</html>
