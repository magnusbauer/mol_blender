<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Molecular render</title>
<style>
:root{color-scheme:light dark;font:14px system-ui,sans-serif}
html,body{margin:0;padding:0;background:transparent}img{display:block;width:100%;height:auto;object-fit:contain}nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0}nav[hidden]{display:none}a,button{font:inherit;color:inherit;border:1px solid #8886;border-radius:6px;padding:7px 12px;text-decoration:none}img[hidden]{display:none}p{margin:0;padding:12px;color:inherit}
</style>
<main id="render">
<img id="preview" alt="Blender molecular render" hidden>
<p id="status" role="status">Waiting for the rendered image…</p>
<nav id="downloads" aria-label="Download render" hidden></nav>
<button id="share" type="button" hidden>Ask ChatGPT about this image</button>
<p id="handoff" role="status" hidden></p>
<button id="save" type="button" hidden>Save files to chat</button>
<p id="saved" role="status" hidden></p>
</main>
<script>
const image = document.getElementById('preview');
const status = document.getElementById('status');
let shown = false;
let saveSource = null;
let saveFiles = [];
let saving = false;
const pendingUploads = new Map();
let restoredFileId = null;
const saveButton = document.getElementById('save');
const savedStatus = document.getElementById('saved');
// Standard MCP Apps image delivery is independent of optional file storage.
let hostReady = false;
let hostCapabilities = {};
let currentImage = null;
let contextKey = null;
let contextBusy = false;
let sharing = false;
const postedImages = new Set();
const rpc = new Map();
let rpcSequence = 0;
const shareButton = document.getElementById('share');
const handoffStatus = document.getElementById('handoff');
function requestHost(method, params) {
  return new Promise((resolve, reject) => {
    const id = 'image-' + (++rpcSequence);
    const timer = setTimeout(() => { rpc.delete(id); reject(new Error('Host response timed out')); }, 10000);
    rpc.set(id, {resolve, reject, timer});
    parent.postMessage({jsonrpc:'2.0', id, method, params}, '*');
  });
}
function imageContent(value) {
  return [{type:'text', text:'Rendered molecular image' + (value.job ? ' for job ' + value.job : '') + '.'},
          {type:'image', mimeType:value.mimeType, data:value.data}];
}
function validModelImage(value) {
  return value && ['image/png','image/jpeg'].includes(value.mimeType) &&
    typeof value.data === 'string' && value.data.length > 0 && value.data.length <= 2796204 &&
    /^[A-Za-z0-9+/]+={0,2}$/.test(value.data);
}
function updateHandoff() {
  shareButton.hidden = !(hostReady && currentImage && hostCapabilities.message?.image);
  shareButton.disabled = sharing || !!(currentImage && postedImages.has(currentImage.key));
  shareButton.textContent = currentImage && postedImages.has(currentImage.key) ? 'Image sent to ChatGPT' : 'Ask ChatGPT about this image';
  if (!hostReady || !currentImage || contextBusy || contextKey === currentImage.key ||
      !hostCapabilities.updateModelContext?.image) return;
  const value = currentImage;
  contextKey = value.key; // Do not retry a failed/ambiguous request automatically.
  contextBusy = true;
  requestHost('ui/update-model-context', {content:imageContent(value)})
    .then(result => {
      if (result?.isError) throw new Error('Context rejected');
      if (currentImage?.key === value.key) {
        handoffStatus.hidden = false;
        handoffStatus.textContent = 'Image supplied as context for your next message.';
      }
    })
    .catch(() => {
      if (currentImage?.key === value.key) {
        handoffStatus.hidden = false;
        handoffStatus.textContent = 'Image context could not be confirmed. You can send it using the button.';
      }
    })
    .finally(() => { contextBusy = false; updateHandoff(); });
}
function setModelImage(result) {
  const preview = result._meta?.preview || result.preview;
  const value = validModelImage(preview) ? preview : result.content?.find(validModelImage);
  if (!value) return;
  const job = result.structuredContent?.job_id || result._meta?.saveImage?.jobId || '';
  const key = job + '/' + value.mimeType + '/' + value.data;
  if (currentImage?.key === key) return;
  currentImage = {mimeType:value.mimeType, data:value.data, key, job};
  handoffStatus.hidden = true;
  updateHandoff();
}
shareButton.onclick = async () => {
  if (sharing || !hostReady || !currentImage || !hostCapabilities.message?.image || postedImages.has(currentImage.key)) return;
  const value = currentImage;
  sharing = true;
  updateHandoff();
  handoffStatus.hidden = false;
  handoffStatus.textContent = 'Sending image to ChatGPT…';
  try {
    const content = imageContent(value);
    content[0].text += ' Describe what you can see in this image.';
    const result = await requestHost('ui/message', {role:'user', content});
    if (result?.isError) throw new Error('Image rejected');
    postedImages.add(value.key);
    if (currentImage?.key === value.key) handoffStatus.textContent = 'Image sent to ChatGPT for this conversation.';
  } catch (_) {
    if (currentImage?.key === value.key) handoffStatus.textContent = 'Image delivery is unconfirmed. Check the chat before retrying.';
  } finally { sharing = false; updateHandoff(); }
};
let storedImage = window.openai?.widgetState?.privateContent?.savedImage || null;
let savedFiles = window.openai?.widgetState?.privateContent?.savedFiles || {};
if (storedImage && !savedFiles['render.png']) savedFiles['render.png'] = storedImage;
const fileTypes = {'render.png':'image/png','render.gif':'image/gif','render.mp4':'video/mp4',
  'render.blend':'application/octet-stream','manifest.json':'application/json','frames.zip':'application/zip'};
function alreadySaved(file) { return !!savedFiles[file.name]?.fileId && savedFiles[file.name].jobId === file.jobId; }
function hydrateState(state) {
  const files = state?.privateContent?.savedFiles || {};
  for (const [name, file] of Object.entries(files)) {
    if (fileTypes[name] && typeof file?.fileId === 'string' && file.fileId &&
        (!saveSource || file.jobId === saveSource.jobId)) savedFiles[name] = file;
  }
  storedImage = savedFiles['render.png'] || storedImage;
}
function downloadControls(links = []) {
  const bar = document.getElementById('downloads');
  bar.replaceChildren();
  const entries = new Map();
  for (const item of links) {
    try {
      const url = new URL(item.url);
      if (fileTypes[item.name] && url.protocol === 'https:' && !url.username && !url.password && url.pathname.startsWith('/download/')) entries.set(item.name, item);
    } catch (_) {}
  }
  for (const [name, file] of Object.entries(savedFiles)) {
    if (!saveSource || file.jobId === saveSource.jobId) entries.set(name, {...entries.get(name), name, jobId:file.jobId});
  }
  for (const item of entries.values()) {
    if (!fileTypes[item.name]) continue;
    let href = null;
    try {
      const url = new URL(item.url);
      if (url.protocol === 'https:' && !url.username && !url.password && url.pathname.startsWith('/download/')) href = url.href;
    } catch (_) {}
    const saved = savedFiles[item.name];
    if (!href && !saved?.fileId) continue;
    const link = document.createElement('a');
    link.textContent = 'Download ' + item.name.split('.').pop().toUpperCase();
    link.href = href || '#'; link.target = '_blank'; link.rel = 'noopener noreferrer';
    link.addEventListener('click', async event => {
      const file = savedFiles[item.name];
      if (file?.fileId && (!item.jobId || file.jobId === item.jobId)) {
        event.preventDefault();
        try {
          const {downloadUrl} = await window.openai.getFileDownloadUrl({fileId:file.fileId});
          const url = new URL(downloadUrl);
          if (url.protocol !== 'https:' || url.username || url.password) throw new Error();
          if (window.openai?.openExternal) window.openai.openExternal({href:url.href});
          else window.open(url.href, '_blank', 'noopener,noreferrer');
        } catch (_) { savedStatus.hidden=false; savedStatus.textContent='The saved file could not be opened.'; }
      } else if (href && window.openai?.openExternal) {
        event.preventDefault(); window.openai.openExternal({href});
      }
    });
    bar.append(link);
  }
  bar.hidden = !bar.children.length;
}
let downloadLinks = [];
async function restoreSavedImage() {
  const saved = savedFiles['render.gif'] || storedImage;
  if (!saved?.fileId || !window.openai?.getFileDownloadUrl || restoredFileId === saved.fileId) return;
  restoredFileId = saved.fileId;
  try {
    const {downloadUrl} = await window.openai.getFileDownloadUrl({fileId:saved.fileId});
    const url = new URL(downloadUrl);
    if (url.protocol !== 'https:' || url.username || url.password) throw new Error();
    image.src = url.href;
    savedStatus.hidden = false;
    savedStatus.textContent = 'Image saved in ChatGPT.';
  } catch (_) {
    restoredFileId = null;
    savedStatus.hidden = false;
    savedStatus.textContent = 'The saved image could not be opened in this session.';
  }
}
function refreshSaving() {
  hydrateState(window.openai?.widgetState);
  downloadControls(downloadLinks);
  if (savedFiles['render.gif'] || storedImage) restoreSavedImage();
  if (!saveSource) return;
  const available = !!(window.openai?.uploadFile && window.openai?.setWidgetState);
  saveButton.hidden = !available;
  if (!available) {
    savedStatus.hidden = false;
    savedStatus.textContent = 'File saving is unavailable in this host. The image is still visible in this panel.';
    resize();
  }
}
saveButton.onclick = async () => {
  if (saving || !saveSource || !window.openai?.uploadFile || !window.openai?.setWidgetState) return;
  const sources = saveFiles.map(file => ({...file}));
  saving = true; saveButton.disabled = true; savedStatus.hidden = false;
  const failed = [];
  for (const source of sources) {
    if (alreadySaved(source)) continue;
    const key = source.jobId + '/' + source.name;
    savedStatus.textContent = 'Saving ' + source.name.split('.').pop().toUpperCase() + ' to ChatGPT…';
    try {
      let fileId = pendingUploads.get(key);
      if (!fileId) {
        const url = new URL(source.url);
        const readable = url.pathname.startsWith('/preview/') ||
          (url.pathname.startsWith('/download/') && url.searchParams.get('delivery') === 'ack');
        if (!fileTypes[source.name] || url.protocol !== 'https:' || url.username || url.password || !readable) throw new Error();
        const response = await fetch(url.href, {credentials:'omit', signal:AbortSignal.timeout(30000)});
        if (!response.ok || !response.headers.get('content-type')?.startsWith(fileTypes[source.name])) throw new Error();
        const blob = await response.blob();
        if (blob.size > 64 * 1024 * 1024) throw new Error();
        ({fileId} = await window.openai.uploadFile(new File([blob], source.name, {type:fileTypes[source.name]}), {library:true}));
        if (typeof fileId !== 'string' || !fileId) throw new Error();
        pendingUploads.set(key, fileId);
      }
      if (saveSource.jobId !== source.jobId) break;
      const nextFiles = {...savedFiles, [source.name]:{fileId, jobId:source.jobId}};
      const nextImage = nextFiles['render.png'] || null;
      await window.openai.setWidgetState({modelContent:'Saved render files: ' + Object.keys(nextFiles).join(', '),
        privateContent:{savedImage:nextImage, savedFiles:nextFiles}});
      savedFiles = nextFiles; storedImage = nextImage;
      pendingUploads.delete(key);
      downloadControls(downloadLinks);
    } catch (_) { failed.push(source.name); }
  }
  const confirmed = sources.filter(alreadySaved).map(f => f.name.split('.').pop().toUpperCase());
  savedStatus.textContent = (confirmed.length ? confirmed.join(', ') + ' saved in ChatGPT. ' : '') +
    (failed.length ? failed.join(', ') + ' not saved. Retry or download these files.' : '');
  saveButton.disabled = !failed.length;
  saveButton.textContent = failed.length ? 'Retry saving files' : 'Files saved';
  saving = false; resize();
};
function resize() {
  const height = Math.ceil(document.getElementById('render').getBoundingClientRect().height);
  window.openai?.notifyIntrinsicHeight?.(height);
  if (parent !== window) parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height}}, '*');
}
function render(envelope) {
  if (!envelope || typeof envelope !== 'object') return;
  // ChatGPT wraps the MCP envelope; MCP Apps sends it directly. Older
  // ChatGPT bridges expose the hidden metadata as the value itself.
  const result = envelope.mcp_tool_result || envelope.call_tool_result || envelope;
  setModelImage(result);
  const legacy = result._meta?.saveImage || result.saveImage;
  const files = result._meta?.saveFiles || result.saveFiles || (legacy ? [{...legacy,name:'render.png',mimeType:'image/png'}] : []);
  const source = files.find(file => fileTypes[file.name]);
  if (source) {
    savedFiles = Object.fromEntries(Object.entries(savedFiles).filter(([,file]) => file.jobId === source.jobId));
    storedImage = savedFiles['render.png'] || null;
    if (saveSource && source.jobId !== saveSource.jobId) restoredFileId = null;
  }
  if (files.length) saveFiles = files.filter(file => fileTypes[file.name]);
  if (source) {
    saveSource = source;
    saveButton.hidden = !(window.openai?.uploadFile && window.openai?.setWidgetState);
    if (saveFiles.every(alreadySaved)) { saveButton.disabled = true; saveButton.textContent = 'Files saved'; }
    refreshSaving();
  }
  const links = result._meta?.downloads || result.downloads;
  if (Array.isArray(links)) downloadLinks = links;
  downloadControls(downloadLinks);
  if ((savedFiles['render.gif'] || storedImage) && window.openai?.getFileDownloadUrl) {
    restoreSavedImage();
    return;
  }
  const preview = result._meta?.preview || result.preview ||
    result.content?.find(item => item.type === 'image' && ['image/png','image/gif'].includes(item.mimeType));
  if (preview?.mimeType === 'image/gif' && typeof preview.url === 'string' && preview.url.length < 4096) {
    try {
      const url = new URL(preview.url);
      if (url.protocol === 'https:' && !url.username && !url.password && url.pathname.startsWith('/preview/')) {
        if (image.getAttribute('src') !== url.href) image.src = url.href;
        return;
      }
    } catch (_) {}
  }
  if (['image/png','image/gif'].includes(preview?.mimeType) && typeof preview.data === 'string' &&
      preview.data.length <= 2796204 && /^[A-Za-z0-9+/]+={0,2}$/.test(preview.data)) {
    const source = 'data:' + preview.mimeType + ';base64,' + preview.data;
    if (image.getAttribute('src') !== source) image.src = source;
    return;
  }
  if (!shown && result.structuredContent) {
    status.textContent = 'The image preview is unavailable. Rendering has not been repeated.';
  }
}
new ResizeObserver(resize).observe(document.getElementById('render'));
image.onload = () => {
  shown = true;
  image.hidden = false;
  status.hidden = true;
  resize();
};
image.onerror = () => {
  shown = false;
  image.hidden = true;
  status.hidden = false;
  status.textContent = 'The preview is unavailable or has expired. Rendering has not been repeated.';
  if ((storedImage || savedFiles['render.gif']) && !image.dataset.restoring) { image.dataset.restoring = 'true'; restoreSavedImage(); }
  resize();
};
window.addEventListener('message', event => {
  if (event.source !== parent || event.data?.jsonrpc !== '2.0') return;
  const message = event.data;
  const waiting = rpc.get(message.id);
  if (waiting && ("result" in message || "error" in message)) {
    clearTimeout(waiting.timer); rpc.delete(message.id);
    if (message.error) waiting.reject(new Error("Host rejected request"));
    else waiting.resolve(message.result);
    return;
  }
  if (message.method === 'ping' && message.id !== undefined) {
    parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}}, '*');
  }
  if (message.method === 'ui/notifications/tool-result') render(message.params);
  if (message.id === 'initialize' && message.result) {
    hostReady = true;
    hostCapabilities = message.result.hostCapabilities || {};
    parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'}, '*');
    updateHandoff();
  }
});
window.addEventListener('openai:set_globals', event => {
  hydrateState(event.detail?.globals?.widgetState);
  render(event.detail?.globals?.toolResponseMetadata);
  refreshSaving();
});
// Some hosts install file extensions after the tool-result notification.
let bridgeChecks = 0;
const bridgeTimer = setInterval(() => {
  if (saveSource && window.openai?.uploadFile && window.openai?.setWidgetState) {
    refreshSaving(); clearInterval(bridgeTimer);
  } else if (++bridgeChecks >= 30) clearInterval(bridgeTimer);
}, 1000);
downloadControls();
render(window.openai?.toolResponseMetadata);
render(window.openai?.toolOutput);
if ((storedImage || savedFiles['render.gif']) && !image.getAttribute('src')) restoreSavedImage();
if (parent !== window) parent.postMessage({jsonrpc:'2.0',id:'initialize',method:'ui/initialize',params:{
  appInfo:{name:'Blender Render',version:'0.2.0b1'},appCapabilities:{},protocolVersion:'2026-01-26'
}}, '*');
setTimeout(() => {
  if (!shown && !image.getAttribute('src')) {
    status.textContent = 'ChatGPT has not supplied the image to this viewer. Rendering has not been repeated.';
    resize();
  }
}, 15000);
</script>
</html>
